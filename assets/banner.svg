<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08343e"/><stop offset="1" stop-color="#136a74"/></linearGradient><clipPath id="cl0"><rect class="k0" x="130" y="300" height="60" width="0"/></clipPath><clipPath id="cl1"><rect class="k1" x="130" y="300" height="60" width="0"/></clipPath><clipPath id="cl2"><rect class="k2" x="130" y="300" height="60" width="0"/></clipPath><clipPath id="cl3"><rect class="k3" x="130" y="300" height="60" width="0"/></clipPath></defs>
<style>
.ring{fill:none;stroke:#f2b84b;transform-origin:1300px 120px}
.r1{stroke-width:3;opacity:.25;animation:pulse 7s ease-in-out infinite}
.r2{stroke-width:3;opacity:.2;animation:pulse 7s ease-in-out 1.2s infinite}
.r3{stroke-width:3;opacity:.3;animation:pulse 7s ease-in-out 2.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.tw{animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.bar{transform-origin:94px 300px;animation:bar 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.name{animation:in 1.2s .2s cubic-bezier(.2,.8,.2,1) both}
.sub{animation:in 1.2s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.sheen{animation:sheen 8s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1800px)}}
@keyframes t0{0%,0%{width:0;animation-timing-function:steps(26,end)}7%,22%{width:546.0px}24%,100%{width:0}} @keyframes c0{0%,0%{transform:translateX(0);opacity:0;animation-timing-function:steps(26,end)}0.2%{opacity:1}7%,22%{transform:translateX(546.0px);opacity:1}24%,100%{transform:translateX(0);opacity:0}} .k0{animation:t0 16s infinite} .q0{animation:c0 16s infinite} @keyframes t1{0%,25%{width:0;animation-timing-function:steps(21,end)}32%,47%{width:441.0px}49%,100%{width:0}} @keyframes c1{0%,25%{transform:translateX(0);opacity:0;animation-timing-function:steps(21,end)}25.2%{opacity:1}32%,47%{transform:translateX(441.0px);opacity:1}49%,100%{transform:translateX(0);opacity:0}} .k1{animation:t1 16s infinite} .q1{animation:c1 16s infinite} @keyframes t2{0%,50%{width:0;animation-timing-function:steps(33,end)}57%,72%{width:693.0px}74%,100%{width:0}} @keyframes c2{0%,50%{transform:translateX(0);opacity:0;animation-timing-function:steps(33,end)}50.2%{opacity:1}57%,72%{transform:translateX(693.0px);opacity:1}74%,100%{transform:translateX(0);opacity:0}} .k2{animation:t2 16s infinite} .q2{animation:c2 16s infinite} @keyframes t3{0%,75%{width:0;animation-timing-function:steps(30,end)}82%,97%{width:630.0px}99%,100%{width:0}} @keyframes c3{0%,75%{transform:translateX(0);opacity:0;animation-timing-function:steps(30,end)}75.2%{opacity:1}82%,97%{transform:translateX(630.0px);opacity:1}99%,100%{transform:translateX(0);opacity:0}} .k3{animation:t3 16s infinite} .q3{animation:c3 16s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.k0{width:546.0px}}
</style>
<rect width="1600" height="420" fill="url(#g)"/>
<circle class="ring r1" cx="1300" cy="120" r="260"/><circle class="ring r2" cx="1300" cy="120" r="380"/><circle class="ring r3" cx="1300" cy="120" r="500"/>
<circle cx="1180" cy="70" r="2.2" fill="#f2b84b" class="tw" style="animation-delay:0s"/><circle cx="1320" cy="150" r="2.2" fill="#f2b84b" class="tw" style="animation-delay:1.1s"/><circle cx="1450" cy="60" r="2.2" fill="#f2b84b" class="tw" style="animation-delay:2.2s"/><circle cx="1260" cy="300" r="2.2" fill="#f2b84b" class="tw" style="animation-delay:0.6s"/><circle cx="1500" cy="250" r="2.2" fill="#f2b84b" class="tw" style="animation-delay:1.7s"/><circle cx="1050" cy="360" r="2.2" fill="#f2b84b" class="tw" style="animation-delay:2.8s"/><circle cx="1400" cy="350" r="2.2" fill="#f2b84b" class="tw" style="animation-delay:0.3s"/>
<g class="sheen"><polygon points="0,0 120,0 40,420 -80,420" fill="#ffffff" opacity=".05"/></g>
<rect class="bar" x="90" y="120" width="8" height="180" fill="#f2b84b"/>
<text class="name" x="130" y="205" font-family="Montserrat,'Segoe UI',Arial,sans-serif" font-weight="700" font-size="76" fill="#fff" textLength="1000" lengthAdjust="spacingAndGlyphs">MOUSTAFA ELGOUHARI</text>
<text class="sub" x="130" y="262" font-family="Montserrat,'Segoe UI',Arial,sans-serif" font-size="26" fill="#bfe0e2">AI Engineer  |  Tested projects, honest numbers</text>
<text x="130" y="342" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="35" fill="#f2b84b" textLength="546.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#cl0)">RAG  and  LLM applications</text><rect class="q0" x="130" y="312" width="3" height="40" fill="#f2b84b" opacity="0"/><text x="130" y="342" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="35" fill="#f2b84b" textLength="441.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#cl1)">Multi-agent workflows</text><rect class="q1" x="130" y="312" width="3" height="40" fill="#f2b84b" opacity="0"/><text x="130" y="342" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="35" fill="#f2b84b" textLength="693.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#cl2)">LLM evaluation, honestly measured</text><rect class="q2" x="130" y="312" width="3" height="40" fill="#f2b84b" opacity="0"/><text x="130" y="342" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="35" fill="#f2b84b" textLength="630.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#cl3)">Computer vision and Arabic NLP</text><rect class="q3" x="130" y="312" width="3" height="40" fill="#f2b84b" opacity="0"/>
