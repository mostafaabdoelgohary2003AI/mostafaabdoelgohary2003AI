<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
<style>.f{animation:fl 4.2s ease-in-out 2.25s infinite}.gl{transform-origin:64px 66px;animation:gl 4.2s ease-in-out 2.25s infinite}
@keyframes fl{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}
@keyframes gl{0%,100%{opacity:.10;transform:scale(.9)}50%{opacity:.38;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><radialGradient id="rg"><stop offset="0" stop-color="#f2b84b"/><stop offset="1" stop-color="#f2b84b" stop-opacity="0"/></radialGradient></defs>
<circle class="gl" cx="64" cy="66" r="58" fill="url(#rg)"/>
<g class="f"><image x="16" y="14" width="96" height="96" xlink:href="data:image/png;base64,"/></g></svg>